<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Log Maintenance | ' + ${component.name}">Log Maintenance | Component</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        .navbar {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            box-shadow: 0 2px 12px rgba(13,110,253,0.25);
        }
        .brand-icon { font-size: 1.4rem; color: #20c997; }

        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            max-width: 600px;
            margin: 0 auto;
        }
        .form-card .card-header {
            background: linear-gradient(135deg, #198754 0%, #157347 100%);
            color: #fff;
            border-radius: 16px 16px 0 0;
            padding: 1.75rem 2rem;
        }
        .form-card .card-header h1 { font-weight: 700; font-size: 1.5rem; margin-bottom: 0.15rem; }
        .form-card .card-header p  { opacity: 0.85; font-size: 0.9rem; margin-bottom: 0; }
        .form-card .card-body { padding: 2rem; }

        .form-label { font-weight: 600; font-size: 0.9rem; color: #374151; }
        .form-control {
            border-radius: 8px;
            border-color: #d1d5db;
            padding: 0.65rem 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.25);
        }
        .btn-submit {
            background: linear-gradient(135deg, #198754 0%, #157347 100%);
            border: none;
            border-radius: 8px;
            padding: 0.7rem 2rem;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .type-badge { font-size: 0.85rem; padding: 0.4em 0.8em; border-radius: 6px; font-weight: 600; background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-droplet-fill brand-icon"></i>
            RWH Tracker
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/systems}"><i class="bi bi-hdd-stack me-1"></i>Systems</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/alerts}"><i class="bi bi-bell me-1"></i>Alerts</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/systems}">Systems</a></li>
            <li class="breadcrumb-item"><a th:href="@{/systems/{id}(id=${component.system.id})}" th:text="${component.system.name}">System</a></li>
            <li class="breadcrumb-item active">Log Maintenance</li>
        </ol>
    </nav>

    <div class="card form-card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-clipboard2-check me-2"></i>Log Maintenance</h1>
                <p>Record a maintenance action for <strong th:text="${component.name}">Component</strong></p>
            </div>
            <span class="type-badge" th:text="${component.type.name().replace('_',' ')}">TYPE</span>
        </div>
        <div class="card-body">
            <form th:action="@{/components/{id}/logs(id=${component.id})}" th:object="${maintenanceLog}" method="post" novalidate>
                
                <div class="mb-4">
                    <label for="performedAt" class="form-label">Date Performed <span class="text-danger">*</span></label>
                    <input type="date" id="performedAt" class="form-control" th:classappend="${#fields.hasErrors('performedAt')} ? 'is-invalid'" th:field="*{performedAt}" />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('performedAt')}" th:errors="*{performedAt}">Date error</div>
                    <div class="form-text text-muted small">The component's next due date will be calculated based on this date.</div>
                </div>

                <div class="mb-4">
                    <label for="notes" class="form-label">Maintenance Notes <span class="text-muted fw-normal small">— optional</span></label>
                    <textarea id="notes" class="form-control" th:field="*{notes}" rows="3" placeholder="Describe the work done... (e.g., Cleaned filter mesh, removed debris)"></textarea>
                </div>
                
                <div class="mb-4">
                    <label for="photoUrl" class="form-label">Photo URL <span class="text-muted fw-normal small">— optional</span></label>
                    <input type="url" id="photoUrl" class="form-control" th:field="*{photoUrl}" placeholder="https://..." />
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-submit w-100">
                        <i class="bi bi-save me-2"></i>Save Log
                    </button>
                    <a th:href="@{/systems/{id}(id=${component.system.id})}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
