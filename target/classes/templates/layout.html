<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | RWH Tracker' : 'RWH Tracker'}">RWH Tracker</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <style>
        :root {
            --rwh-primary: #0d6efd;
            --rwh-accent: #20c997;
            --rwh-dark: #1a1d23;
            --rwh-card-bg: #ffffff;
        }

        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ── Navbar ────────────────────────────────────────────────────────── */
        .navbar-brand .brand-icon {
            font-size: 1.4rem;
            color: var(--rwh-accent);
        }

        .navbar {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            box-shadow: 0 2px 12px rgba(13, 110, 253, 0.25);
        }

        /* ── Cards ─────────────────────────────────────────────────────────── */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
            transform: translateY(-2px);
        }

        /* ── Badges per component type ──────────────────────────────────────── */
        .badge-TANK              { background-color: #0d6efd; }
        .badge-FILTER            { background-color: #20c997; }
        .badge-FIRST_FLUSH_DIVERTER { background-color: #6610f2; }
        .badge-GUTTER_MESH       { background-color: #fd7e14; }
        .badge-PUMP              { background-color: #dc3545; }
        .badge-OVERFLOW          { background-color: #6c757d; }

        /* ── Page header ────────────────────────────────────────────────────── */
        .page-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: #fff;
            border-radius: 12px;
            padding: 2rem 2.5rem;
            margin-bottom: 1.5rem;
        }

        .page-header h1 { font-weight: 700; margin-bottom: 0.25rem; }
        .page-header p  { opacity: 0.85; margin-bottom: 0; }
    </style>
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-droplet-fill brand-icon"></i>
            RWH Tracker
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/systems}">
                        <i class="bi bi-hdd-stack me-1"></i>Systems
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-light btn-sm ms-2 px-3"
                       th:href="@{/systems/new}">
                        <i class="bi bi-plus-circle me-1"></i>New System
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ── Main content slot ────────────────────────────────────────────────────── -->
<main class="container pb-5">

    <!-- Flash success alert -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Page-specific content injected here via th:replace / th:insert -->
    <th:block th:replace="${~{::content}}"></th:block>

</main>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
