<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard | RWH Tracker</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); box-shadow: 0 2px 12px rgba(13,110,253,0.25); }
        .brand-icon { font-size: 1.4rem; color: #20c997; }

        .summary-card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .summary-card:hover { transform: translateY(-3px); }
        .summary-card .icon-circle { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        
        .card-healthy { border-left: 5px solid #198754; }
        .card-healthy .icon-circle { background-color: #d1e7dd; color: #198754; }
        
        .card-duesoon { border-left: 5px solid #ffc107; }
        .card-duesoon .icon-circle { background-color: #fff3cd; color: #ffc107; }
        
        .card-overdue { border-left: 5px solid #dc3545; }
        .card-overdue .icon-circle { background-color: #f8d7da; color: #dc3545; }
        
        .card-total { border-left: 5px solid #0d6efd; }
        .card-total .icon-circle { background-color: #cfe2ff; color: #0d6efd; }

        .component-list-card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .component-list-card .card-header { background: #fff; border-bottom: 1px solid #e5e7eb; border-radius: 12px 12px 0 0; }
        
        .type-badge { font-size: 0.75rem; padding: 0.35em 0.75em; border-radius: 6px; font-weight: 600; }
        .type-TANK { background: #dbeafe; color: #1d4ed8; }
        .type-FILTER { background: #d1fae5; color: #065f46; }
        .type-FIRST_FLUSH_DIVERTER { background: #ede9fe; color: #5b21b6; }
        .type-GUTTER_MESH { background: #fef3c7; color: #92400e; }
        .type-PUMP { background: #fee2e2; color: #991b1b; }
        .type-OVERFLOW { background: #e5e7eb; color: #374151; }
        
        .status-overdue { background: #fee2e2; color: #991b1b; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600;}
        .status-due-soon { background: #fef3c7; color: #92400e; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600;}
        .status-ok { background: #d1fae5; color: #065f46; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600;}
        .status-unknown { background: #e5e7eb; color: #374151; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600;}
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-droplet-fill brand-icon"></i>
            RWH Tracker
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/systems}"><i class="bi bi-hdd-stack me-1"></i>Systems</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/alerts}"><i class="bi bi-bell me-1"></i>Alerts</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="fw-bold mb-0 text-dark"><i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard</h2>
    </div>
    
    <!-- Summary Cards -->
    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="card summary-card card-healthy h-100 p-3">
                <div class="card-body d-flex align-items-center gap-3 p-0">
                    <div class="icon-circle"><i class="bi bi-check-circle-fill"></i></div>
                    <div>
                        <h6 class="text-muted mb-0 fw-semibold">Healthy</h6>
                        <h2 class="mb-0 fw-bold text-dark" th:text="${healthyCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card summary-card card-duesoon h-100 p-3">
                <div class="card-body d-flex align-items-center gap-3 p-0">
                    <div class="icon-circle"><i class="bi bi-clock-fill"></i></div>
                    <div>
                        <h6 class="text-muted mb-0 fw-semibold">Due Soon</h6>
                        <h2 class="mb-0 fw-bold text-dark" th:text="${dueSoonCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card summary-card card-overdue h-100 p-3">
                <div class="card-body d-flex align-items-center gap-3 p-0">
                    <div class="icon-circle"><i class="bi bi-exclamation-triangle-fill"></i></div>
                    <div>
                        <h6 class="text-muted mb-0 fw-semibold">Overdue</h6>
                        <h2 class="mb-0 fw-bold text-dark" th:text="${overdueCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card summary-card card-total h-100 p-3">
                <div class="card-body d-flex align-items-center gap-3 p-0">
                    <div class="icon-circle"><i class="bi bi-puzzle-fill"></i></div>
                    <div>
                        <h6 class="text-muted mb-0 fw-semibold">Total Components</h6>
                        <h2 class="mb-0 fw-bold text-dark" th:text="${totalCount}">0</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Components List with Search -->
    <div class="card component-list-card">
        <div class="card-header py-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-collection me-2 text-primary"></i>All Components</h5>
            
            <form th:action="@{/dashboard}" method="get" class="d-flex">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="q" class="form-control border-start-0 ps-0" placeholder="Search name or type..." th:value="${query}" />
                    <button type="submit" class="btn btn-outline-primary">Search</button>
                    <a th:if="${query != null and !query.isEmpty()}" th:href="@{/dashboard}" class="btn btn-outline-secondary">Clear</a>
                </div>
            </form>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(components)}" class="text-center py-5 text-muted">
                <i class="bi bi-search d-block mb-2" style="font-size: 2rem;"></i>
                <p>No components found.</p>
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(components)}">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Component</th>
                            <th>Type</th>
                            <th>System</th>
                            <th>Next Due Date</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="comp : ${components}">
                            <td class="ps-4 fw-semibold" th:text="${comp.name}">Name</td>
                            <td><span th:class="'type-badge type-' + ${comp.type.name()}" th:text="${comp.type.name().replace('_',' ')}">TYPE</span></td>
                            <td><a th:href="@{/systems/{id}(id=${comp.system.id})}" class="text-decoration-none" th:text="${comp.system.name}">System</a></td>
                            <td th:text="${comp.nextDueDate != null ? comp.nextDueDate : 'Not scheduled'}">Date</td>
                            <td>
                                <span th:if="${comp.nextDueDate == null}" class="status-unknown"><i class="bi bi-question-circle me-1"></i>Unknown</span>
                                <span th:if="${comp.nextDueDate != null}"
                                      th:with="today=${T(java.time.LocalDate).now()}, daysLeft=${T(java.time.temporal.ChronoUnit).DAYS.between(today, comp.nextDueDate)}"
                                      th:class="${daysLeft < 0} ? 'status-overdue' : (${daysLeft <= 7} ? 'status-due-soon' : 'status-ok')">
                                      <i th:class="${daysLeft < 0} ? 'bi bi-exclamation-triangle-fill me-1' : (${daysLeft <= 7} ? 'bi bi-clock-fill me-1' : 'bi bi-check-circle-fill me-1')"></i>
                                      <span th:if="${daysLeft < 0}">Overdue</span>
                                      <span th:if="${daysLeft >= 0 and daysLeft <= 7}" th:text="'Due in ' + ${daysLeft} + 'd'"></span>
                                      <span th:if="${daysLeft > 7}">Healthy</span>
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/dashboard/components/{id}(id=${comp.id})}" class="btn btn-sm btn-outline-primary" title="View History">
                                    <i class="bi bi-clock-history"></i>
                                </a>
                                <a th:href="@{/components/{id}/logs/new(id=${comp.id})}" class="btn btn-sm btn-outline-success ms-1" title="Log Maintenance">
                                    <i class="bi bi-clipboard2-check"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
