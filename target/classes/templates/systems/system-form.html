<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Register a new rainwater harvesting system"/>
    <title>New System | RWH Tracker</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', system-ui, sans-serif; }

        .navbar {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            box-shadow: 0 2px 12px rgba(13,110,253,0.25);
        }
        .brand-icon { font-size: 1.4rem; color: #20c997; }

        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            max-width: 560px;
            margin: 0 auto;
        }
        .form-card .card-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: #fff;
            border-radius: 16px 16px 0 0;
            padding: 1.75rem 2rem;
        }
        .form-card .card-header h1 { font-weight: 700; font-size: 1.5rem; margin-bottom: 0.15rem; }
        .form-card .card-header p  { opacity: 0.85; font-size: 0.9rem; margin-bottom: 0; }
        .form-card .card-body { padding: 2rem; }

        .form-label { font-weight: 600; font-size: 0.9rem; color: #374151; }
        .form-control {
            border-radius: 8px;
            border-color: #d1d5db;
            padding: 0.65rem 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            border: none;
            border-radius: 8px;
            padding: 0.7rem 2rem;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-droplet-fill brand-icon"></i>
            RWH Tracker
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/systems}">
                        <i class="bi bi-hdd-stack me-1"></i>Systems
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-light btn-sm ms-2 px-3 active"
                       th:href="@{/systems/new}">
                        <i class="bi bi-plus-circle me-1"></i>New System
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/systems}">Systems</a></li>
            <li class="breadcrumb-item active">New System</li>
        </ol>
    </nav>

    <!-- Form card -->
    <div class="card form-card">
        <div class="card-header">
            <h1><i class="bi bi-plus-circle me-2"></i>Register New System</h1>
            <p>Add a new rainwater harvesting installation to track.</p>
        </div>
        <div class="card-body">
            <form th:action="@{/systems}" th:object="${system}" method="post" novalidate>

                <!-- System Name -->
                <div class="mb-4">
                    <label for="systemName" class="form-label">System Name <span class="text-danger">*</span></label>
                    <input type="text"
                           id="systemName"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                           th:field="*{name}"
                           placeholder="e.g. Rooftop Collection Unit A"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">Name error</div>
                </div>

                <!-- Location -->
                <div class="mb-4">
                    <label for="systemLocation" class="form-label">Location <span class="text-danger">*</span></label>
                    <input type="text"
                           id="systemLocation"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                           th:field="*{location}"
                           placeholder="e.g. Building 3, North Wing Rooftop"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}"
                         th:errors="*{location}">Location error</div>
                </div>

                <!-- Actions -->
                <div class="d-flex gap-2">
                    <button type="submit" id="submitSystemBtn" class="btn btn-primary btn-submit">
                        <i class="bi bi-save me-2"></i>Register System
                    </button>
                    <a th:href="@{/systems}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
