<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="View and manage all registered rainwater harvesting systems"/>
    <title>Systems | RWH Tracker</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <style>
        body { background-color: #f0f4f8; font-family: 'Segoe UI', system-ui, sans-serif; }

        .navbar {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            box-shadow: 0 2px 12px rgba(13,110,253,0.25);
        }
        .brand-icon { font-size: 1.4rem; color: #20c997; }

        .page-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: #fff;
            border-radius: 12px;
            padding: 2rem 2.5rem;
            margin-bottom: 1.5rem;
        }
        .page-header h1 { font-weight: 700; margin-bottom: 0.25rem; }
        .page-header p  { opacity: 0.85; margin-bottom: 0; }

        .system-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
            cursor: pointer;
        }
        .system-card:hover {
            box-shadow: 0 6px 24px rgba(0,0,0,0.14);
            transform: translateY(-3px);
        }
        .system-card .card-icon {
            font-size: 2.5rem;
            color: #0d6efd;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #6c757d;
        }
        .empty-state i { font-size: 4rem; opacity: 0.4; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-droplet-fill brand-icon"></i>
            RWH Tracker
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/systems}">
                        <i class="bi bi-hdd-stack me-1"></i>Systems
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-light btn-sm ms-2 px-3"
                       th:href="@{/systems/new}">
                        <i class="bi bi-plus-circle me-1"></i>New System
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">

    <!-- Flash message -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Page header -->
    <div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div>
            <h1><i class="bi bi-hdd-stack me-2"></i>Registered Systems</h1>
            <p th:text="${#lists.size(systems)} + ' system(s) registered'">0 systems registered</p>
        </div>
        <a th:href="@{/systems/new}" class="btn btn-light fw-semibold px-4">
            <i class="bi bi-plus-circle me-2"></i>Register New System
        </a>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(systems)}" class="empty-state">
        <i class="bi bi-droplet-half d-block mb-3"></i>
        <h4 class="fw-semibold">No systems registered yet</h4>
        <p class="mb-4">Start by registering your first rainwater harvesting system.</p>
        <a th:href="@{/systems/new}" class="btn btn-primary px-4">
            <i class="bi bi-plus-circle me-2"></i>Register First System
        </a>
    </div>

    <!-- Systems grid -->
    <div class="row g-4" th:unless="${#lists.isEmpty(systems)}">
        <div class="col-md-6 col-lg-4" th:each="sys : ${systems}">
            <a th:href="@{/systems/{id}(id=${sys.id})}"
               class="text-decoration-none">
                <div class="card system-card h-100 p-3">
                    <div class="card-body">
                        <div class="d-flex align-items-start gap-3 mb-3">
                            <div class="rounded-circle bg-primary bg-opacity-10 p-3">
                                <i class="bi bi-droplet-fill card-icon"></i>
                            </div>
                            <div>
                                <h5 class="fw-bold mb-1 text-dark" th:text="${sys.name}">System Name</h5>
                                <span class="text-muted small">
                                    <i class="bi bi-geo-alt me-1"></i>
                                    <span th:text="${sys.location}">Location</span>
                                </span>
                            </div>
                        </div>
                        <div class="d-flex align-items-center justify-content-between">
                            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2">
                                <i class="bi bi-puzzle me-1"></i>
                                <span th:text="${#lists.size(sys.components)}">0</span> component(s)
                            </span>
                            <span class="text-primary small fw-semibold">
                                View Details <i class="bi bi-arrow-right-short"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
